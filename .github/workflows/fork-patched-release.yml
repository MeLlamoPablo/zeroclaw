name: Patched Release (fork)

# Fork-only workflow: builds the Linux release archives for a patched branch
# and publishes them as a GitHub release of this fork. It reuses upstream's
# release recipe unchanged (the web job below, the `build-release-payloads`
# action and `package_release_archive.sh`), so the archives have the same
# layout and features as the official ones, for the two Linux targets that
# `zeroclaw update` knows.
#
# Trigger: push a tag named `patched-*` (e.g. `patched-v0.8.7-fix12187.1`).
# Upstream's tag-triggered workflows listen to `v*`, so a `patched-` tag never
# starts a Docker publish or a stable release here.

on:
  push:
    tags:
      - "patched-*"

permissions:
  contents: read

concurrency:
  group: patched-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Upstream commit this branch is based on (the v0.8.7 tag). The fork has no
  # upstream tags, so the release notes list the commits on top of it by SHA.
  UPSTREAM_BASE: 99bd353c756f4e64f381cfe9c3002ebff32f3055

jobs:
  web:
    name: Build Web Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web dashboard
        run: cargo web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 links against glibc 2.35, as upstream does (#3573).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: zeroclaw
            ext: tar.gz
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: zeroclaw
            ext: tar.gz
            cross_compiler: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ matrix.os }}-${{ matrix.target }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/

      - name: Install cross compiler
        if: matrix.cross_compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.cross_compiler }}

      - name: Prepare bounded Linux ARM64 build memory
        id: dist_memory
        timeout-minutes: 5
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: bash scripts/ci/dist_runner_memory.sh prepare

      - name: Build release
        uses: ./.github/actions/build-release-payloads
        with:
          target: ${{ matrix.target }}
          linker_env: ${{ matrix.linker_env || '' }}
          linker: ${{ matrix.linker || '' }}
          use_cross: 'false'
          emit_features: 'false'
          cargo-jobs: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '2' || '' }}

      - name: Check binary size
        shell: bash
        run: bash scripts/ci/check_binary_size.sh "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "${{ matrix.target }}"
        env:
          BINARY_SIZE_HARD_LIMIT: "83886080"

      - name: Package
        run: bash scripts/ci/package_release_archive.sh "${{ matrix.target }}" "${{ matrix.artifact }}" "${{ matrix.ext }}" "$RUNNER_OS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeroclaw-${{ matrix.target }}
          path: zeroclaw-${{ matrix.target }}.${{ matrix.ext }}
          retention-days: 14

      - name: Report and release owned Linux ARM64 build memory
        timeout-minutes: 5
        if: always() && matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          ZC_DIST_SWAP_FILE: ${{ steps.dist_memory.outputs.swap_file }}
          ZC_DIST_SWAP_IDENTITY: ${{ steps.dist_memory.outputs.swap_identity }}
        run: bash scripts/ci/dist_runner_memory.sh cleanup

  publish:
    name: Publish GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zeroclaw-*
          path: release-assets
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's|  \./|  |' > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          {
            echo "Patched build of ZeroClaw ${version} from \`${GITHUB_SHA::12}\`."
            echo
            echo "Upstream base: zeroclaw-labs/zeroclaw@${UPSTREAM_BASE::12}. Commits on top:"
            echo
            git log --reverse --format='- %h %s' "${UPSTREAM_BASE}..${GITHUB_SHA}"
            echo
            echo "Fixes https://github.com/zeroclaw-labs/zeroclaw/issues/12187 (includes https://github.com/zeroclaw-labs/zeroclaw/pull/12188)."
            echo
            echo "\`zeroclaw update\` only reads upstream releases; install these archives by hand and check them against \`SHA256SUMS\`."
          } > release-notes.md
          cat release-notes.md
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ZeroClaw ${version} + fix for #12187 (${TAG})" \
            --notes-file release-notes.md
